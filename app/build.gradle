plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'gg.ollie.codmloader'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'gg.ollie.codmloader'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // the hook lib is dlopened by absolute path out of nativeLibraryDir, so the
    // apk must keep the libs extracted instead of mapping them from the archive.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// no androidx: every screen is framework View code, like the reference loader.

// the injector binary is written into src/main/assets by cmake; assets must
// merge only after the native build produced it.
tasks.configureEach { t ->
    if (t.name.startsWith('merge') && t.name.contains('Assets')) {
        t.dependsOn(tasks.matching { it.name.startsWith('externalNativeBuild') })
    }
}
